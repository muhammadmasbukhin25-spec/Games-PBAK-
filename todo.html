<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To‑Do List - Games PBAK</title>
  <link rel="stylesheet" href="todo.css">
</head>
<body>
  <main class="app">
    <h1>To‑Do List</h1>

    <form id="todo-form" class="todo-form" aria-label="Tambah tugas">
      <input id="todo-input" placeholder="Tambahkan tugas baru..." autocomplete="off" />
      <button type="submit">Tambah</button>
    </form>

    <div class="controls">
      <span id="count"></span>
      <button id="clear-completed">Hapus Selesai</button>
      <button id="clear-all">Hapus Semua</button>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
  </main>

  <script src="todo.js"></script>
</body>
</html>
